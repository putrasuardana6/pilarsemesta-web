<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pilar Semesta Development - Client & Site Portal</title>
  
  <!-- Favicon & Mobile App Icons -->
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pilar Portal">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0F172A">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0F172A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* Seamless Loading Screen */
    #loadingScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #0F172A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #loadingScreen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .brand-mark {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #FFFFFF;
      margin-bottom: 6px;
    }

    .sub-mark {
      font-size: 12px;
      color: #94A3B8;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #2563EB;
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Embedded Full-Screen Application */
    #appFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: #0F172A;
    }
  </style>
</head>
<body>

  <!-- Loading State -->
  <div id="loadingScreen">
    <div class="brand-mark">PILAR SEMESTA DEVELOPMENT</div>
    <div class="sub-mark">Operations & Site Verification Portal</div>
    <div class="spinner"></div>
  </div>

  <!-- Apps Script Web App -->
  <!-- PASTE YOUR GOOGLE APPS SCRIPT URL IN THE SRC ATTRIBUTE BELOW -->
  <iframe 
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbyKEtQbd5rpgELAZ08DrYo5RXy3kD6whDm7XBn0J23OJLDHNqzx19SJ5yspMfLNZLcSXA/exec"
    allow="camera; microphone; geolocation"
    onload="dismissLoader()">
  </iframe>

  <script>
    function dismissLoader() {
      const loader = document.getElementById('loadingScreen');
      if (loader) {
        loader.classList.add('hidden');
      }
    }

    // Safety fallback: dismiss loader after 6 seconds in case of slow connection
    setTimeout(dismissLoader, 6000);
  </script>
</body>
</html>
